<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roast My Resume | not ur regular hr</title>
    <meta name="description" content="Get your resume roasted — brutally honest, AI-powered hiring perception analysis. What recruiters actually see. What's costing you the role. How to fix it." />
    <meta property="og:title" content="Roast My Resume | not ur regular hr" />
    <meta property="og:description" content="Not a scanner. A roast. Find out exactly why your resume isn't landing — from someone who's been on every side of the hiring table." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Google Analytics 4 — set VITE_GA_MEASUREMENT_ID in Vercel environment variables -->
    <script>
      (function() {
        var id = '%VITE_GA_MEASUREMENT_ID%';
        if (!id || id.charAt(0) === '%') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){ window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', id, { send_page_view: false });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
